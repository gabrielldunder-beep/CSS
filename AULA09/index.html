<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
         h1 {
            color: rgb(226, 7, 7);
         }

        </style>

        <!-- CSS Externo - O MELHOR DE TODOS !!!! -->

</head>
<body>

    <!--css inline -->

    -->

</body>
</html>
